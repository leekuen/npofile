# 放到 /etc/nginx/sites-available/npofile，把 example.com 換成你的網域
# HTTPS 的設定由 certbot --nginx 自動補上，不用手寫
server {
    listen 80;
    server_name example.com;

    client_max_body_size 10m;

    # Django 管理後台用的 CSS／JS（collectstatic 產生）
    location /static/ {
        alias /home/npofile/app/server/staticfiles/;
        expires 7d;
    }

    # 管理後台直接給 Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他（前台頁面與 /api/*）給 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
