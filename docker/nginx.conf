# compose 裡的 nginx：cloudflared（或本機測試）連到這裡的 :80
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 每次請求都問 Docker 內建 DNS（127.0.0.11）backend／web 的 IP，不要只在 nginx 啟動時查一次。
    # 自動更新重建容器後 IP 會換，寫死在 proxy_pass 的主機名只會解析一次 → 指向舊 IP → 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $web_upstream http://web:3000;

    # Django 管理後台的 CSS／JS（backend 啟動時 collectstatic 到共用 volume）
    location /static/ {
        alias /static/;
        expires 7d;
    }

    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 其他（前台頁面與 /api/*）給 Next.js，它再把 /api/* 轉給 backend
    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
