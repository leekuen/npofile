# NPOFile 的 Docker Compose（LK-14）。說明：docker/README.md
#   cp .env.example .env   # 填值
#   docker compose up -d --build
# 映像檔支援 linux/amd64 與 linux/arm64（Apple Silicon）。
name: npofile

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# backend 與 scheduler 共用的設定
x-app-env: &app-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?請在 .env 設 DJANGO_SECRET_KEY}
  # backend：web container 用 http://backend:8000 呼叫 API 時的 Host
  DJANGO_ALLOWED_HOSTS: ${DOMAIN:?請在 .env 設 DOMAIN},backend,localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-true}
  DATABASE_URL: postgres://npofile:${POSTGRES_PASSWORD:?請在 .env 設 POSTGRES_PASSWORD}@db:5432/npofile
  CRAWLER_MIN_INTERVAL: ${CRAWLER_MIN_INTERVAL:-1.0}
  DONOR_INDIVIDUAL_THRESHOLD: ${DONOR_INDIVIDUAL_THRESHOLD:-100000}
  HEALTHCHECKS_PING_KEY: ${HEALTHCHECKS_PING_KEY:-}
  # 環境部開放資料 API 金鑰（環境部裁處來源 moenv_penalties，LK-36）；沒設那個來源會失敗、其他照跑
  MOENV_API_KEY: ${MOENV_API_KEY:-}
  # 組織官網財報讀數字（LK-17）：二選一。API 金鑰按用量付費；Claude Code 權杖走訂閱帳號（`claude setup-token` 拿），每次最多讀幾份
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  FINANCIAL_EXTRACT_MAX_PER_RUN: ${FINANCIAL_EXTRACT_MAX_PER_RUN:-10}
  BACKUP_DIR: /backups
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
  LOG_DIR: /logs
  APP_ENV: /nonexistent
  TZ: Asia/Taipei

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: npofile
      POSTGRES_DB: npofile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Taipei
    volumes:
      - ${PG_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npofile -d npofile"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: npofile-backend
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/server/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/stats"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  web:
    build:
      context: web
      args:
        API_BASE: http://backend:8000
    image: npofile-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      web:
        condition: service_healthy
    # 只開給這台主機自己（本機測試用）；對外走 cloudflared，不用開防火牆
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    logging: *logging

  # 排程：備份、爬蟲、清舊資料與重算揭露指數（時間表在 docker/crontab）
  scheduler:
    image: npofile-backend
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_CLASSIFY: "1"
    command: ["supercronic", "-passthrough-logs", "/app/docker/crontab"]
    volumes:
      - ${BACKUP_DIR_HOST:-./data/backups}:/backups
      - ${LOG_DIR_HOST:-./data/logs}:/logs
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  # 自動更新：每 5 分鐘看 GitHub 的 prod 有沒有新版，有就 git pull＋重建重啟其他服務（docker/auto-update.sh）
  # 要操作這台的 Docker，所以掛 docker.sock；repo 要掛在跟主機一樣的路徑，compose 裡的相對路徑才對得上
  updater:
    build:
      context: docker
      dockerfile: updater.Dockerfile
    image: npofile-updater
    restart: unless-stopped
    working_dir: ${PWD}
    entrypoint: ["sh", "docker/auto-update.sh"]
    environment:
      AUTO_UPDATE_BRANCH: ${AUTO_UPDATE_BRANCH:-prod}
      AUTO_UPDATE_INTERVAL: ${AUTO_UPDATE_INTERVAL:-300}
      COMPOSE_PROJECT_NAME: npofile
      TZ: Asia/Taipei
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["autoupdate"]
    logging: *logging

  # 對外：Cloudflare Tunnel。在 Cloudflare 後台把 Public Hostname 指到 http://nginx:80
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}  # 啟用 tunnel profile 時必填（.env）
    depends_on:
      - nginx
    logging: *logging

volumes:
  # collectstatic 的產物，backend 寫、nginx 讀；每次啟動重新產生，不用備份
  static:
