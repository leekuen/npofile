# compose 裡的 nginx：cloudflared（或本機測試）連到這裡的 :80
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Django 管理後台的 CSS／JS（backend 啟動時 collectstatic 到共用 volume）
    location /static/ {
        alias /static/;
        expires 7d;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 其他（前台頁面與 /api/*）給 Next.js，它再把 /api/* 轉給 backend
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
