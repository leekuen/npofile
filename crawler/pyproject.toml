[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npofile-crawler"
version = "0.1.0"
description = "NPOFile 爬蟲：抓公開資料、解析成整齊的資料，不依賴後台框架"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", "beautifulsoup4>=4.12",
    # 財報 PDF（LK-25）：讀文字；掃描檔畫成圖片再做影像辨識
    "pdfminer.six>=20240706", "pypdfium2>=4.30", "rapidocr-onnxruntime>=1.3",
]

[tool.setuptools]
packages = ["npofile_crawler"]
