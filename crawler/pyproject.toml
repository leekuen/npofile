[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npofile-crawler"
version = "0.1.0"
description = "NPOFile 爬蟲：抓公開資料、解析成整齊的資料，不依賴後台框架"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
# 讀財務報告 PDF 的數字（LK-17）；沒裝就只收報告清單
ai = ["anthropic>=2.14,<3"]

[tool.setuptools]
packages = ["npofile_crawler"]
